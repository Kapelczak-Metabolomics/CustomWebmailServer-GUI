services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coturn:
    image: coturn/coturn
    command: >-
      sh -c "exec turnserver -n -f
      --realm=$${TURN_REALM:-isotopiq.local}
      --use-auth-secret
      --static-auth-secret=$${TURN_SECRET:-change-me}
      --cli-password=$${TURN_SECRET:-change-me}
      --listening-port=18478
      --listening-ip=0.0.0.0
      --relay-ip=0.0.0.0"
    entrypoint: [""]
    environment:
      - TURN_REALM=${TURN_REALM:-isotopiq.local}
      - TURN_SECRET=${TURN_SECRET:-change-me}
    ports:
      - "18478:18478/udp"
      - "18478:18478/tcp"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_IMAP_ENABLED: "true"
    ports:
      - "18125:1025"
      - "18025:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-18300}:18300"
    environment:
      - NODE_ENV=production
      - PORT=18300
      - APP_HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mail}?schema=public
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL:-http://localhost:18300}
      - TURN_REALM=${TURN_REALM:-isotopiq.local}
      - TURN_SECRET=${TURN_SECRET:-change-me}
      - TURN_TTL=${TURN_TTL:-86400}
      - TURN_PORT=18478
      - TURN_HOST=${TURN_HOST:-localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MAILPIT_HOST=mailpit
      - MAILPIT_SMTP_PORT=1025
      - MAILPIT_IMAP_PORT=143
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - appdata:/app/data
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18300/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  appdata:
  uploads:
