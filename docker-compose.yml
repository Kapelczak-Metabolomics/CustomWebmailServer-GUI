services:
  postgres:
    image: postgres:16-alpine
    container_name: isotopiq-mail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: isotopiq-mail-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coturn:
    image: coturn/coturn
    container_name: isotopiq-mail-coturn
    command:
      - "-n"
      - "-f"
      - "-r"
      - "${TURN_REALM:-isotopiq.local}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-change-me}"
      - "--no-cli"
      - "--listening-port=18478"
    ports:
      - "18478:18478/udp"
      - "18478:18478/tcp"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: isotopiq-mail-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_IMAP_ENABLED: "true"
    ports:
      - "18125:1025"
      - "18025:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isotopiq-mail-app
    ports:
      - "18300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mail?schema=public
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL:-http://localhost:18300}
      - TURN_REALM=${TURN_REALM:-isotopiq.local}
      - TURN_SECRET=${TURN_SECRET:-change-me}
      - TURN_TTL=${TURN_TTL:-86400}
      - TURN_PORT=18478
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MAILPIT_HOST=mailpit
      - MAILPIT_SMTP_PORT=1025
      - MAILPIT_IMAP_PORT=143
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURE=false
    volumes:
      - appdata:/app/data
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  appdata:
  uploads:
