services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isotopiq-mail
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s