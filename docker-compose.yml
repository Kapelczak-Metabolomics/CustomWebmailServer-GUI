services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isotopiq-mail
    # Easypanel proxies to container port 8080 via a Domain; no host port binding needed
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - CLIENT_URL=${CLIENT_URL}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - EMAIL_DEFAULT_FROM=${EMAIL_DEFAULT_FROM}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_REALM=${TURN_REALM:-isotopiq.local}
      - TURN_TTL=${TURN_TTL:-86400}
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
