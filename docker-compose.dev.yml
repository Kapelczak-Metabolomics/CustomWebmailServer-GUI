services:
  postgres:
    image: postgres:16-alpine
    container_name: isotopiq-mail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: isotopiq-mail-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn
    container_name: isotopiq-mail-coturn
    command:
      - "-n"
      - "-f"
      - "-r"
      - "${TURN_REALM:-isotopiq.local}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-change-me}"
      - "--no-cli"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: isotopiq-mail-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_IMAP_ENABLED: "true"
    restart: unless-stopped

volumes:
  pgdata:
