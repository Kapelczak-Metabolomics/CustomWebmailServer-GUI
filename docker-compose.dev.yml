services:
  postgres:
    image: postgres:16-alpine
    container_name: isotopiq-mail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: isotopiq-mail-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn
    container_name: isotopiq-mail-coturn
    command:
      - "-n"
      - "-f"
      - "-r"
      - "${TURN_REALM:-isotopiq.local}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-change-me}"
      - "--no-cli"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isotopiq-mail-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mail?schema=public
      - REDIS_URL=redis://redis:6379
      - TURN_REALM=${TURN_REALM:-isotopiq.local}
      - TURN_SECRET=${TURN_SECRET:-change-me}
      - TURN_TTL=${TURN_TTL:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
